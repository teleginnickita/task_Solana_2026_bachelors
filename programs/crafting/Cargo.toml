[package]
name = "crafting"
version = "0.1.0"
description = "Crafting orchestration for Kozatskyi Biznes"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "crafting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
game_core = { path = "../../crates/game_core" }
item_nft = { path = "../item_nft", features = ["cpi"] }
resource_manager = { path = "../resource_manager", features = ["cpi"] }
