[workspace]
members = [
    "crates/game_core",
    "programs/resource_manager",
    "programs/item_nft",
    "programs/crafting",
    "programs/search",
    "programs/marketplace",
    "programs/magic_token",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
mpl-token-metadata = "5.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
